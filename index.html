<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بوابة المعلمات - جمعية فرقان</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--p:#7a1f2b;--pd:#5c1620;--gold:#c9a24b;--bg:#faf6f1;--line:#eadfd8;--muted:#7b6d70;--err:#b3261e}
*{box-sizing:border-box;margin:0}
body{font-family:'Cairo',Tahoma,sans-serif;background:var(--bg);color:#2b2024;min-height:100vh}
.hidden{display:none!important}
.top{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:4px solid var(--gold)}
.top img{width:44px;height:44px;border-radius:10px;background:#fff;padding:3px}
.top b{flex:1;font-size:17px}
.top button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 2px 10px rgba(122,31,43,.06)}
h2{color:var(--p);font-size:18px;margin-bottom:12px}
label{display:block;margin:14px 0 6px;font-weight:700}
input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font:inherit}
input:focus{outline:none;border-color:var(--p)}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer;background:var(--p);color:#fff;text-decoration:none}
.btn:disabled{opacity:.6}
.msg{color:var(--err);min-height:22px;margin-top:10px}
.login{max-width:420px;margin:40px auto;text-align:center}
.login img{width:110px}
.login form{text-align:right}
.login .btn{width:100%;margin-top:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:22px 8px;text-align:center;cursor:pointer;font:inherit;color:var(--p);font-weight:700}
.tile:hover{border-color:var(--gold)}
.tile span{display:block;font-size:30px;margin-bottom:6px}
.tile small{display:block;color:var(--muted);font-weight:400}
.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row span{color:var(--muted)}
.back{background:none;border:0;color:var(--p);font:inherit;font-weight:700;cursor:pointer;margin-bottom:10px}
.soon{text-align:center;color:var(--muted);padding:30px 0}
.certificate{position:relative;width:min(100%,650px);aspect-ratio:1414/2000;margin:auto;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.certificate img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:4.5%;text-align:center;font-weight:700;color:#545454;font-size:var(--cs,22px);padding:40% 8% 22%}
.ct div{width:100%;line-height:1.7}
.ct .d{color:#991529}
</style>
</head>
<body>
<header class="top hidden" id="top"><img src="logo.png" alt=""><b>بوابة المعلمات</b><button id="out">خروج</button></header>

<section class="wrap login card" id="login">
  <img src="logo.png" alt="فرقان">
  <h2 style="margin-top:8px">بوابة المعلمات</h2>
  <p style="color:var(--muted)">جمعية فرقان لتحفيظ القرآن الكريم</p>
  <form id="form">
    <label for="phone">رقم الجوال</label>
    <input id="phone" inputmode="numeric" autocomplete="tel" placeholder="05xxxxxxxx" required>
    <label for="pass">كلمة المرور</label>
    <input id="pass" maxlength="4" autocomplete="off" placeholder="مثال: K7M2" required>
    <button class="btn" id="go">دخول</button>
    <div class="msg" id="msg"></div>
  </form>
</section>

<main class="wrap hidden" id="app"></main>

<script>
const API = "https://script.google.com/macros/s/AKfycbxSfXdn4F-g2M6EJxZfAMY2b1W5hqF-EvFx234VUssU_jVw62nXPqEhIjPkHupnXBLTXA/exec";
const $ = id => document.getElementById(id);
let T = null;

async function api(body) {
  const r = await fetch(API, { method: "POST", body: JSON.stringify(body) });
  return r.json();
}
function show(loggedIn) {
  $("login").classList.toggle("hidden", loggedIn);
  $("top").classList.toggle("hidden", !loggedIn);
  $("app").classList.toggle("hidden", !loggedIn);
}
function logout() { localStorage.removeItem("tp_token"); T = null; show(false); }
$("out").onclick = logout;

$("form").onsubmit = async e => {
  e.preventDefault();
  $("msg").textContent = "جارٍ التحقق...";
  $("go").disabled = true;
  try {
    const r = await api({ action: "login", phone: $("phone").value, password: $("pass").value });
    if (!r.ok) { $("msg").textContent = r.error; return; }
    localStorage.setItem("tp_token", r.token);
    T = r.teacher; $("msg").textContent = ""; $("pass").value = "";
    show(true); home();
  } catch (_) { $("msg").textContent = "تعذر الاتصال. حاولي مرة أخرى."; }
  finally { $("go").disabled = false; }
};

const SECTIONS = [
  ["بياناتي", "👤", "data"], ["شهادتي", "🎓", "cert"],
  ["ملاحظات المشرفة", "📝", "soon"], ["محاضر الاجتماعات", "📋", "soon"],
  ["الرسائل والتنبيهات", "🔔", "soon"]
];
function home() {
  $("app").innerHTML = `<div class="card"><h2>أهلًا ${T.name}</h2><p style="color:var(--muted)">اختاري الخدمة التي تريدينها.</p></div>
  <div class="tiles">${SECTIONS.map((s, i) => `<button class="tile" data-i="${i}"><span>${s[1]}</span>${s[0]}${s[2] === "soon" ? "<small>قريبًا</small>" : ""}</button>`).join("")}</div>`;
  document.querySelectorAll(".tile").forEach(b => b.onclick = () => open(+b.dataset.i));
}
function open(i) {
  const [title, , kind] = SECTIONS[i];
  const back = `<button class="back" id="bk">← الرئيسية</button>`;
  let html;
  if (kind === "data") html = `<div class="card"><h2>بياناتي</h2>
    <div class="row"><span>الاسم</span><b>${T.name}</b></div>
    <div class="row"><span>فئة التدريس</span><b>${T.category || "-"}</b></div>
    <div class="row"><span>رقم الجوال</span><b dir="ltr">${T.phone}</b></div>
    <div class="row"><span>رقم المعلمة</span><b dir="ltr">${T.id}</b></div></div>`;
  else if (kind === "cert") html = `<div class="certificate" id="cert"><img src="certificate.png" alt=""><div class="ct">
    <div>تهنئ إدارة التعليم النسائي<br>بجمعية فرقان لتحفيظ القرآن الكريم</div>
    <div>الأستاذة الفاضلة/ <span class="d">${T.name}</span></div>
    <div>لاجتيازها اختبار قياس الثاني في القرآن الكريم لعام ١٤٤٧هـ</div>
    <div>فئة التدريس: <span class="d">${T.category}</span></div>
    <div>سائلين الله لها التوفيق والسداد<br>وأن يجعل القرآن حجةً لها لا عليها.</div></div></div>
    <div style="text-align:center;margin:16px"><button class="btn" id="pdf">تحميل PDF</button></div>`;
  else html = `<div class="card"><h2>${title}</h2><p class="soon">هذه الخدمة ستتوفر قريبًا.</p></div>`;
  $("app").innerHTML = back + html;
  $("bk").onclick = home;
  if (kind === "cert") { fitCert(); $("pdf").onclick = pdf; }
}
function fitCert() {
  const c = $("cert"); if (c) c.style.setProperty("--cs", Math.round(c.offsetWidth * 0.04) + "px");
}
addEventListener("resize", fitCert);

function loadScript(src) {
  return new Promise((ok, no) => {
    if (document.querySelector(`script[src="${src}"]`)) return ok();
    const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no();
    document.body.appendChild(s);
  });
}
async function pdf() {
  const b = $("pdf"), old = b.textContent; b.disabled = true; b.textContent = "جارٍ التجهيز...";
  try {
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
    const canvas = await html2canvas($("cert"), { scale: 3, useCORS: true, backgroundColor: "#fff" });
    const doc = new window.jspdf.jsPDF({ orientation: "portrait", unit: "cm", format: [21, 29.7] });
    doc.addImage(canvas.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0, 21, 29.7);
    doc.save(`شهادة-اجتياز-${T.name}.pdf`);
  } catch (_) { alert("تعذر إنشاء الملف، تأكدي من الاتصال وحاولي مرة أخرى."); }
  finally { b.disabled = false; b.textContent = old; }
}

(async () => {
  const token = localStorage.getItem("tp_token");
  if (!token) return;
  try {
    const r = await api({ action: "me", token });
    if (r.ok) { T = r.teacher; show(true); home(); } else logout();
  } catch (_) {}
})();
</script>
</body>
</html>
